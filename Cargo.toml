[package]
name = "quic-frp"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitcode = "0.6.9"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.0"
hotpath = { version = "0.28.4", optional = true }
notify = "8.2.0"
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
snap = "1.1.1"
socket2 = "0.6.3"
tokio = { version = "1.53", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "signal",
] }
tokio-util = "0.7.18"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "env-filter",
] }
uuid = { version = "1.27.0", features = ["v4"] }

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-cpu = ["dep:hotpath", "hotpath/hotpath-cpu"]
hotpath-alloc = ["dep:hotpath", "hotpath/hotpath-alloc"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.180"

[profile.release]
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
lto = true

[profile.release.package."*"]
opt-level = "z"
